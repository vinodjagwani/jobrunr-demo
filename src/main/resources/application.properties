spring.application.name=jobrunr-demo
demo.instance-name=instance-${server.port:8080}

# Shared file DB: AUTO_SERVER lets several local JVMs open the same H2 file (JobRunr's job store).
spring.datasource.url=jdbc:h2:file:./data/jobrunr-demo;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# JobRunr uses the DataSource above as its StorageProvider. Server and dashboard are off by default.
jobrunr.background-job-server.enabled=true
jobrunr.background-job-server.poll-interval-in-seconds=5
jobrunr.background-job-server.worker-count=2
jobrunr.dashboard.enabled=true
jobrunr.dashboard.port=8000
jobrunr.jobs.default-number-of-retries=3
jobrunr.jobs.retry-back-off-time-seed=2
